name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version part to bump"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

env:
  IMAGE_NAME: maximiliancraig112/sizearr

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Optional. Only needed to sync the Docker Hub repo description below.
      DOCKERHUB_DESCRIPTION_TOKEN: ${{ secrets.DOCKERHUB_DESCRIPTION_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (validate before tagging)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Determine next version
        id: version
        run: |
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            latest="v0.0.0"
            echo "latest_exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "latest_exists=true" >> "$GITHUB_OUTPUT"
          fi

          version="${latest#v}"
          IFS='.' read -r major minor patch <<< "$version"

          case "${{ inputs.bump }}" in
            major)
              major=$((major + 1)); minor=0; patch=0
              ;;
            minor)
              minor=$((minor + 1)); patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
          esac

          next="v${major}.${minor}.${patch}"
          echo "Bumping ${latest} -> ${next} (${{ inputs.bump }})"
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"
          echo "next=${next}" >> "$GITHUB_OUTPUT"
          echo "version=${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            SIZEARR_VERSION=${{ steps.version.outputs.next }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.title=sizearr
            org.opencontainers.image.description=Browse what's taking up disk space across your movie and TV libraries.
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.next }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          platforms: linux/amd64,linux/arm64

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.next }}" -m "Release ${{ steps.version.outputs.next }}"
          git push origin "${{ steps.version.outputs.next }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.version.outputs.latest_exists }}" = "true" ]; then
            gh release create "${{ steps.version.outputs.next }}" \
              --title "${{ steps.version.outputs.next }}" \
              --generate-notes \
              --notes-start-tag "${{ steps.version.outputs.latest }}"
          else
            gh release create "${{ steps.version.outputs.next }}" \
              --title "${{ steps.version.outputs.next }}" \
              --generate-notes
          fi

      # Syncs the Docker Hub repo's short description + full overview (this
      # README, with relative links rewritten to absolute GitHub URLs).
      #
      # Docker Hub's description API needs a token with "Read, Write, Delete"
      # scope (Read & Write is not enough). Your normal DOCKERHUB_TOKEN almost
      # certainly can't do it. To turn this on: create a separate PAT with
      # that scope and add it as the DOCKERHUB_DESCRIPTION_TOKEN secret. Until
      # then this step just skips itself, and the image's OCI labels still
      # carry the description + repo link.
      - name: Update Docker Hub description
        if: ${{ env.DOCKERHUB_DESCRIPTION_TOKEN != '' }}
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_DESCRIPTION_TOKEN }}
          repository: ${{ env.IMAGE_NAME }}
          short-description: "Browse what's taking up disk space across your movie and TV libraries"
          readme-filepath: ./README.md
          enable-url-completion: true
