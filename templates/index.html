<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Media Size Browser</title>
  <link rel="icon" href="data:,">

  <link rel="stylesheet" href="{{ static_url('vendor/jquery.dataTables-1.13.11.min.css') }}">
  <link rel="stylesheet" href="{{ static_url('css/base.css') }}">
  <link rel="stylesheet" href="{{ static_url('css/layout.css') }}">
  <link rel="stylesheet" href="{{ static_url('css/components.css') }}">
  <link rel="stylesheet" href="{{ static_url('css/table.css') }}">
</head>
<body>
  <div class="wrap">

    <header class="app-header">
      <h1 class="app-header__title">Media Size Browser</h1>
      <span class="scanning-pill" id="scanningPill">
        <span class="spinner"></span>
        <span id="scanningText">Scanning&hellip;</span>
      </span>
    </header>
    <p class="subtitle" id="subtitle">Loading&hellip;</p>

    <section class="stats" aria-label="Library summary">
      <div class="stat"><div class="stat__label">Titles</div><div class="stat__value" id="statTitles">&mdash;</div></div>
      <div class="stat"><div class="stat__label">Total size</div><div class="stat__value" id="statTotal">&mdash;</div></div>
      <div class="stat"><div class="stat__label">Movies</div><div class="stat__value" id="statMovies">&mdash;</div></div>
      <div class="stat"><div class="stat__label">TV</div><div class="stat__value" id="statTv">&mdash;</div></div>
      <div class="stat stat--scan"><div class="stat__label">Last scanned</div><div class="stat__value" id="statScan">&mdash;</div></div>
    </section>

    <div class="toolbar">
      <div class="segmented" id="categoryFilter" aria-label="Filter by category">
        <button type="button" class="segmented__option is-active" data-cat="">All</button>
        <button type="button" class="segmented__option" data-cat="movies">Movies</button>
        <button type="button" class="segmented__option" data-cat="tv">TV</button>
      </div>
      <input type="search" id="search" class="search" placeholder="Search titles&hellip;" aria-label="Search titles">
      <button type="button" id="rescanBtn" class="btn">Rescan now</button>
      <span id="status" class="status"></span>
    </div>

    <div class="table-card">
      <table id="mediaTable" class="display">
        <thead>
          <tr>
            <th class="col-expand" aria-label="Expand"></th>
            <th>Title</th>
            <th>Category</th>
            <th class="col-size">Size</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

  </div>

  <script src="{{ static_url('vendor/jquery-3.7.1.min.js') }}"></script>
  <script src="{{ static_url('vendor/jquery.dataTables-1.13.11.min.js') }}"></script>
  <script src="{{ static_url('js/app.js') }}"></script>
</body>
</html>
